<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockhost</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 15' shape-rendering='crispEdges'%3E%3Cpath fill='%23e8552f' d='M4 1h2v1h1v2h2v2h1v4H9v1H3V9H2V6h1V4h1z'/%3E%3Cpath fill='%23ee9b3d' d='M4 4h2v1h2v2h1v2H8v1H4V9H3V7h1z'/%3E%3Cpath fill='%23ffd27a' d='M5 6h2v1h1v2H7v1H5V9H4V7h1z'/%3E%3Cpath fill='%233a1f0d' d='M1 12h10v2H1z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('bh-theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','dark')}})()</script>
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="/app.css">
</head>
<body class="state-offline">
<div class="ambient" aria-hidden="true"></div>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <span class="brand-fire" id="brandFire"></span>
    <div>
      <div class="brand-name">blockhost</div>
      <div class="brand-sub" id="brandSub">local server</div>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="sidebar-foot">
    <div class="foot-row"><span>Version</span><b id="footVersion">-</b></div>
    <div class="foot-row"><span>Live API</span><b id="footRpc">-</b></div>
  </div>
</aside>

<div class="main">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"></button>
    <div class="top-title">
      <h1 id="pageTitle">Overview</h1>
      <p id="pageSub"></p>
    </div>
    <div class="top-actions">
      <button class="theme-switch" id="themeSwitch" role="switch" aria-checked="false" aria-label="Day camp (light) theme" title="Switch between night camp and day camp"><svg class="moon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M10 1a7 7 0 1 0 5 11 6 6 0 0 1-5-11z"/></svg><svg class="sun" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="8" cy="8" r="3.2"/><path d="M8 0h1v3H8zM8 13h1v3H8zM0 8h3v1H0zM13 8h3v1h-3zM2.3 2.3l.7-.7 2.1 2.1-.7.7zM11.6 11.6l.7-.7 2.1 2.1-.7.7zM2.3 13.7l2.1-2.1.7.7-2.1 2.1zM11.6 4.4l2.1-2.1.7.7-2.1 2.1z"/></svg></button>
      <button class="address-chip" id="topAddress" title="Copy address"></button>
      <div class="state-pill" id="topState"><i></i><span>Offline</span></div>
    </div>
  </header>
  <div class="remote-bar" id="remoteBar" hidden></div>
  <main class="view" id="view"></main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="taskbar" id="taskbar" hidden></div>
<div class="modal-root" id="modalRoot"></div>

<script src="/app.js"></script>
<script src="/pages.js"></script>
<script src="/players.js"></script>
<script src="/pages2.js"></script>
<script src="/pages4.js"></script>
<script src="/pages3.js"></script>
<script src="/pages5.js"></script>
</body>
</html>
