<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockhost</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%237c5cff' d='M16 2 29 9v14l-13 7-13-7V9z'/%3E%3Cpath fill='%23a78bfa' d='M16 2 29 9l-13 7L3 9z'/%3E%3Cpath fill='%235a3fd6' d='M16 16v14l13-7V9z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body class="state-offline">
<div class="ambient" aria-hidden="true"></div>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <svg class="brand-cube" viewBox="0 0 32 32" aria-hidden="true"><path fill="#7c5cff" d="M16 2 29 9v14l-13 7-13-7V9z"/><path fill="#b8a3ff" d="M16 2 29 9l-13 7L3 9z"/><path fill="#5634d4" d="M16 16v14l13-7V9z"/></svg>
    <div>
      <div class="brand-name">blockhost</div>
      <div class="brand-sub" id="brandSub">local server</div>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="sidebar-foot">
    <div class="foot-row"><span>Version</span><b id="footVersion">-</b></div>
    <div class="foot-row"><span>Live API</span><b id="footRpc">-</b></div>
  </div>
</aside>

<div class="main">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"></button>
    <div class="top-title">
      <h1 id="pageTitle">Overview</h1>
      <p id="pageSub"></p>
    </div>
    <div class="top-actions">
      <button class="address-chip" id="topAddress" title="Copy address"></button>
      <div class="state-pill" id="topState"><i></i><span>Offline</span></div>
    </div>
  </header>
  <main class="view" id="view"></main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="taskbar" id="taskbar" hidden></div>
<div class="modal-root" id="modalRoot"></div>

<script src="/app.js"></script>
<script src="/pages.js"></script>
<script src="/players.js"></script>
<script src="/pages2.js"></script>
<script src="/pages4.js"></script>
<script src="/pages3.js"></script>
</body>
</html>
